# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Or use: make install-hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt
        args: [-w, -s]
        language: system
        files: \.go$
        pass_filenames: true

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        files: \.go$
        pass_filenames: false
        always_run: true

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        files: \.go$
        pass_filenames: false
        always_run: true
        stages: [push]

      - id: staticcheck
        name: staticcheck
        entry: bash -c 'if command -v staticcheck > /dev/null; then staticcheck ./...; else $(go env GOPATH)/bin/staticcheck ./...; fi'
        language: system
        files: \.go$
        pass_filenames: false
        always_run: true
